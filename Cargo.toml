[package]
name = "rust-proxy"
version = "0.4.2"
edition = "2024"
description = "Lightweight L7 reverse proxy daemon with native ACME, dynamic nftables orchestration, and a web admin UI"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
authors = ["Jeff Parrish PC Services LLC <https://www.jpps.us>"]
repository = "https://gitlab.jpps.us/jpps/rust-proxy"

[[bin]]
name = "rust-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
regex = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
rustls-pemfile = "2"

axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

ring = "0.17"
rcgen = "0.13"
x509-parser = "0.16"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
arc-swap = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
async-trait = "0.1"
# Namecheap's DNS API is XML-only (every other provider here is JSON) --
# a real dependency, not a per-provider SDK: same "thin direct client"
# philosophy, just parsing a different wire format for the one provider
# that requires it.
quick-xml = "0.36"

hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
rand = "0.8"
argon2 = "0.5"
tower-cookies = "0.10"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
proptest = "1"

[package.metadata.deb]
maintainer = "Jeff Parrish PC Services LLC <https://www.jpps.us>"
copyright = "2026, Jeff Parrish PC Services LLC"
section = "net"
priority = "optional"
extended-description = """\
A lightweight L7 reverse proxy daemon: HTTP/WebSocket reverse proxying \
with SNI-based TLS, a native RFC 8555 ACME client (dns-01 via a \
pluggable, multi-credential DNS provider -- Cloudflare, DigitalOcean, \
Hetzner, DuckDNS, GoDaddy, Namecheap, or Route53), \
dynamic default-DROP nftables firewall orchestration, arbitrary \
TCP/UDP port passthrough, and a small embedded web admin UI with a \
REST API (session or bearer-token auth). Built as an open, \
self-hostable alternative to Nginx Proxy Manager. See README.md."""
assets = [
    ["target/release/rust-proxy", "usr/bin/", "755"],
    ["deploy/rust-proxy.service", "lib/systemd/system/", "644"],
    ["deploy/rust-proxy-backup.service", "lib/systemd/system/", "644"],
    ["deploy/rust-proxy-backup.timer", "lib/systemd/system/", "644"],
    ["deploy/config.toml.example", "usr/share/doc/rust-proxy/", "644"],
    ["README.md", "usr/share/doc/rust-proxy/", "644"],
    ["LICENSE", "usr/share/doc/rust-proxy/", "644"],
    ["COMMERCIAL-LICENSE.md", "usr/share/doc/rust-proxy/", "644"],
    ["CLA.md", "usr/share/doc/rust-proxy/", "644"],
]
maintainer-scripts = "deploy/debian/"
