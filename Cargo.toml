[package]
name = "rust-proxy"
version = "0.1.0"
edition = "2021"
description = "Lightweight L7 reverse proxy daemon with native ACME, dynamic nftables orchestration, and a web admin UI"
license = "Proprietary"

[[bin]]
name = "rust-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
rustls-pemfile = "2"

axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

ring = "0.17"
rcgen = "0.13"
x509-parser = "0.16"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
arc-swap = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
async-trait = "0.1"

hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
rand = "0.8"
argon2 = "0.5"
tower-cookies = "0.10"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
